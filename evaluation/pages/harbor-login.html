<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Harbor Bank — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
    }
    .top {
      background: #0b3a5b;
      color: #fff;
      padding: 14px 28px;
      font-weight: 600;
    }
    .card {
      max-width: 420px;
      margin: 48px auto;
      background: #fff;
      border: 1px solid #e2e6ea;
      border-radius: 10px;
      padding: 28px 28px 22px;
    }
    .title {
      font-size: 22px;
      font-weight: 650;
      margin: 0 0 6px;
    }
    .field { margin: 14px 0; position: relative; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1px solid #c5cdd4;
      border-radius: 6px;
      font-size: 15px;
    }
    .eye {
      position: absolute;
      right: 6px;
      top: 8px;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .submit {
      width: 100%;
      margin-top: 8px;
      background: #0b3a5b;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }
    .forgot {
      display: inline-block;
      margin-top: 12px;
      font-size: 11px;
      color: #0b3a5b;
    }
  </style>
</head>
<body>
  <div class="top">Harbor Bank</div>
  <main class="card">
    <div class="title">Sign in</div>
    <p id="subtitle" style="color:#c8c8c8; font-size:14px; margin:0 0 12px;">
      Use the email and password from your welcome letter.
    </p>
    <form id="loginForm">
      <div class="field">
        <input id="email" type="email" tabindex="3" placeholder="Email"
               style="outline:none">
      </div>
      <div class="field">
        <input id="password" type="password" tabindex="1" placeholder="Password"
               style="outline:none">
        <button type="button" class="eye" id="togglePw" tabindex="2" style="outline:none"></button>
      </div>
      <button class="submit" type="submit" style="outline:none">Sign in</button>
    </form>
    <a class="forgot" href="#forgot" style="outline:none">Forgot?</a>
    <p id="status"></p>
  </main>
  <script>
    document.getElementById("togglePw").addEventListener("click", function () {
      var pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
