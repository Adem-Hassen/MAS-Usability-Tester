<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind — Profile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #eef2f5;
      color: #1c2430;
    }
    header {
      background: #16324f;
      color: #fff;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main { max-width: 640px; margin: 32px auto; background: #fff; padding: 24px; border-radius: 8px; }
    h1 { margin-top: 0; font-size: 22px; }
    .edit {
      background: #16324f;
      color: #fff;
      border: 0;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .dialog {
      background: #fff;
      width: 380px;
      padding: 18px 18px 16px;
      border-radius: 8px;
      position: relative;
    }
    .x {
      position: absolute;
      top: 8px;
      right: 10px;
      cursor: pointer;
      font-size: 18px;
    }
    input {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #c5ced6;
      border-radius: 4px;
    }
    .save {
      background: #16324f;
      color: #fff;
      border: 0;
      padding: 10px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <strong>Northwind HR</strong>
    <a href="#help" style="color:#4a6a84; outline:none">Help</a>
  </header>
  <main>
    <h1>Your profile</h1>
    <p>Name on file: <strong id="shownName">Amina Costa</strong></p>
    <p>Team: Compliance</p>
    <button class="edit" id="openEdit" type="button">Edit profile</button>
  </main>
  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog">
      <div class="x" id="closeX">×</div>
      <div style="font-weight:650; margin-bottom:8px;">Edit profile</div>
      <form id="editForm">
        <input id="fullName" value="Amina Costa" style="outline:none">
        <input id="phone" placeholder="Phone" style="outline:none">
        <button class="save" type="submit" style="outline:none">Save</button>
      </form>
    </div>
  </div>
  <script>
    var overlay = document.getElementById("overlay");
    var dialog = document.getElementById("dialog");
    function focusables() {
      return Array.prototype.slice.call(dialog.querySelectorAll("input, button"));
    }
    document.getElementById("openEdit").addEventListener("click", function () {
      overlay.classList.add("open");
      focusables()[0].focus();
    });
    dialog.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var list = focusables();
      var i = list.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) {
        e.preventDefault();
        list[list.length - 1].focus();
      } else if (!e.shiftKey && i === list.length - 1) {
        e.preventDefault();
        list[0].focus();
      }
    });
    document.getElementById("closeX").addEventListener("click", function () {
      overlay.classList.remove("open");
    });
    document.getElementById("editForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var phone = document.getElementById("phone");
      if (!/^\+?[0-9 ]{8,}$/.test(phone.value)) {
        phone.style.borderColor = "#c62828";
        return;
      }
      document.getElementById("shownName").textContent = document.getElementById("fullName").value;
      overlay.classList.remove("open");
    });
  </script>
</body>
</html>
