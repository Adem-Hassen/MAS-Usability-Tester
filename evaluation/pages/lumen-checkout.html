<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lumen — Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Segoe UI", sans-serif;
      background: #faf7f2;
      color: #222;
    }
    header {
      padding: 16px 32px;
      background: #2c2416;
      color: #fff;
      font-size: 18px;
    }
    .wrap {
      max-width: 720px;
      margin: 32px auto;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
      background: #fff;
      border: 1px solid #eadfce;
      padding: 24px;
    }
    img.product { width: 200px; height: 200px; object-fit: cover; background: #ddd; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .price { font-size: 20px; margin: 0 0 4px; }
    .note { font-size: 13px; margin: 0 0 16px; }
    input {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #cfc3b0;
      border-radius: 4px;
      font-size: 15px;
    }
    .terms {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 12px 0;
      cursor: pointer;
      user-select: none;
    }
    .box {
      width: 16px;
      height: 16px;
      border: 1px solid #888;
      background: #fff;
      flex: none;
    }
    .box.on { background: #2c2416; }
    button.pay {
      background: #2c2416;
      color: #fff;
      border: 0;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>Lumen</header>
  <div class="wrap">
    <img class="product" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect fill='%23d8c7a8' width='200' height='200'/><text x='40' y='110' font-size='20' fill='%232c2416'>Oak lamp</text></svg>">
    <form id="payForm">
      <h1>Checkout</h1>
      <p class="price">€86.00</p>
      <p class="note" style="color:#b0b0b0">Ships in 3–5 days. VAT included.</p>
      <input id="card" placeholder="Card number" style="outline:none">
      <input id="expiry" placeholder="Expiry" style="outline:none">
      <input id="cvv" placeholder="CVV" style="outline:none">
      <div class="terms" id="terms">
        <div class="box" id="termsBox"></div>
        <span>I agree to the terms</span>
      </div>
      <button class="pay" type="submit" style="outline:none">Continue</button>
      <p id="payStatus"></p>
    </form>
  </div>
  <script>
    var agreed = false;
    document.getElementById("terms").addEventListener("click", function () {
      agreed = !agreed;
      document.getElementById("termsBox").classList.toggle("on", agreed);
    });
    document.getElementById("payForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var card = document.getElementById("card");
      var expiry = document.getElementById("expiry");
      card.style.borderColor = "";
      expiry.style.borderColor = "";
      if (!/^\d{16}$/.test(card.value.replace(/\s/g, ""))) {
        card.style.borderColor = "#d32f2f";
        return;
      }
      if (!/^\d{2}\/\d{2}$/.test(expiry.value)) {
        expiry.style.borderColor = "#d32f2f";
        return;
      }
      if (!agreed) {
        document.getElementById("termsBox").style.borderColor = "#d32f2f";
        return;
      }
      document.getElementById("payStatus").textContent = "Payment accepted.";
    });
  </script>
</body>
</html>
